# The build-and-sync steps live in theted/workflows/.github/workflows/deploy-static.yml; the
# reasoning behind the cache headers and the three-pass upload order is in static-s3.md in the
# private theted/infrastructure repo.
#
# Switching to it is also the fix for a known deviation: the sync this replaces passed no
# --cache-control at all, so every object was served with no Cache-Control header and caching fell
# back to heuristics. The shared workflow gives assets/* the immutable year and everything with a
# stable URL max-age=0, must-revalidate.
name: Deploy to S3

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time. The shared workflow deletes superseded objects in its second and third
# passes, so two overlapping runs could have the loser sweep assets the winner had just published.
# deploy-static.yml declares no concurrency of its own, and a called workflow runs inside this
# workflow's run, so this group covers it.
concurrency:
  group: deploy-s3
  cancel-in-progress: true

jobs:
  deploy:
    uses: theted/workflows/.github/workflows/deploy-static.yml@master
    with:
      # Matches .nvmrc.
      node-version: '20'
      # The tests gate the deploy, as they did when this workflow had its own Test step. The shared
      # workflow has no separate test input, so they hang off the build command; a failure here
      # stops the run before any credentials are configured.
      build-command: npm run test:run && npm run build
      dist-dir: dist
    secrets: inherit
